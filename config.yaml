# Config for rendering the yaml templates
# Default: sidecar mode (./render.sh components/sidecar/*.yaml)

APP_NS: default
GW_NS: istio-system
APP_NAME: ezsso
EXT_AUTH_HOST: api.ezsso.me

# Opt-in labels (all use ezsso-role):
#   ezsso-role: client   - sidecar mode (app pods)
#   ezsso-role: waypoint - ambient mode (waypoint proxies)
#   ezsso-role: gateway  - ingress gateway
